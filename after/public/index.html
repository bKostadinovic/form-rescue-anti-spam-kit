<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <header class="header">
          <h1>Contact</h1>
          <p class="subtext">Use the form below and we'll get back to you soon.</p>
        </header>

        <form id="contactForm" class="form">
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@email.com" />
          </div>

          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here"></textarea>
          </div>

          <!-- anti-spam: should stay empty (bots often fill everything) -->
           <div class="hp">
            <label for="company">Company></label>
            <input id="company" name="company" type="text" autocomplete="off" />
           </div>

          <button type="submit">Send Message</button>

          <p id="status" class="status"></p>
          <p class="note">If something goes wrong, please try again later.</p>
        </form>
      </section>
    </main>

    <script src="./client.js"></script>
  </body>
</html>
